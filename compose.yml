name: jobsmartai
services:
  django-backend:
    build:
      context: .
      dockerfile: ./django_backend/Dockerfile
    image: jobsmartai-django
    command: >
        sh -c "
        python manage.py migrate &&
        daphne -b 0.0.0.0 -p 8000 jobsmartai.asgi:application"
    ports:
      - "8090:8000"
    env_file: ./django_backend/.env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - fastembed_cache:/models/fastembed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: ./django_backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsmartai -d jobsmartai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  celery:
    image: jobsmartai-django
    command: celery -A jobsmartai worker -l info
    env_file: ./django_backend/.env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - fastembed_cache:/models/fastembed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      django-backend:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    image: jobsmartai-django
    command: celery -A jobsmartai beat -l info
    env_file: ./django_backend/.env
    depends_on:
      - celery
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: streamlit_frontend/Dockerfile
    environment:
      API_URL: http://django-backend:8000/api
    ports:
      - "8501:8501"
    depends_on:
      - django-backend
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  hf_cache:
  fastembed_cache:

networks:
  default:
    name: jobsmartai_network
